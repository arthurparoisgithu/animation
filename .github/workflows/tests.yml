name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    # Les tests de validation tournent sans rien, mais ceux de l'API ont
    # besoin d'un vrai Postgres : les tableaux, le jsonb et l'operateur de
    # contenance ne s'emulent pas en SQLite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: animation
          # Le « % » est deliberé. Les hebergeurs generent des mots de passe
          # aleatoires qui en contiennent, et un « % » dans l'URL faisait
          # echouer la migration avant meme la connexion. La CI joue donc le
          # cas reel plutot que le cas facile.
          POSTGRES_PASSWORD: anim%pass
          POSTGRES_DB: animation
        ports:
          - 5432:5432
        # -U animation est indispensable dans le health-cmd : sans utilisateur
        # explicite, pg_isready reprend celui du systeme (root), qui n'existe
        # pas en base. Le service n'est alors jamais declare sain et le job
        # s'arrete avant d'avoir lance le moindre test.
        options: >-
          --health-cmd "pg_isready -U animation -d animation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Mot de passe encode selon la norme des URI : %25 vaut « % ».
      DATABASE_URL: postgresql+psycopg://animation:anim%25pass@localhost:5432/animation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Appliquer les migrations
        run: alembic upgrade head

      - name: Lancer les tests
        # Aucun secret n'est necessaire : l'appel au modele est simule dans
        # les tests, donc aucune cle d'API ne circule dans la CI.
        run: pytest
