# Configuration Fly.io.
# « app » doit correspondre au nom cree par « fly launch » — remplace-le
# si tu en choisis un autre.
app = "generateur-jeux-animation"
primary_region = "cdg"   # Paris

[build]

[env]
  # La demo publique rejoue des generations deja enregistrees dans
  # fixtures/ : elle montre de vraies sorties de modele sans qu'un seul
  # appel soit facture.
  MODE_MODELE = "rejeu"

[deploy]
  # Joue avant chaque mise en ligne, sur une machine ephemere :
  #   1. les tables sont creees ou mises a jour ;
  #   2. le catalogue est insere — le seed est idempotent, donc le rejouer
  #      a chaque deploiement garde les gabarits a jour sans risque ;
  #   3. les fixtures sont rejouees pour remplir la demo. Sans cette
  #      troisieme etape, un visiteur arrive sur une application vide.
  #      Idempotent aussi : un jeu deja en base est resservi, pas duplique.
  release_command = "sh -c 'alembic upgrade head && python -m scripts.seed && python -m scripts.campagne --rejouer'"

[http_service]
  internal_port = 8080
  force_https = true
  # La demo peut dormir quand personne ne la consulte : pas de machine
  # facturee en continu. Le premier visiteur attend une seconde de plus.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options]
    h2_backend = false

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks]
  [checks.sante]
    type = "http"
    port = 8080
    method = "GET"
    path = "/sante"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
